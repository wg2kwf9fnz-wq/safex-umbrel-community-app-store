version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: telegrapho_test_app_1
      APP_PORT: 3712

  app:
    # Replace this with the published GHCR digest after the test image build succeeds.
    image: ghcr.io/wg2kwf9fnz-wq/telegrapho:welcome-test-1
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3712
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
