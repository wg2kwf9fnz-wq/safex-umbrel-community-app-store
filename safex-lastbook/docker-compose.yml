services:
  app_proxy:
    environment:
      APP_HOST: safex-lastbook_app_1
      APP_PORT: 8890

  app:
    image: ghcr.io/wg2kwf9fnz-wq/safex-lastbook:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      LASTBOOK_DATA: /data/LastbookData
      XDG_CONFIG_HOME: /data/config
      LASTBOOK_UMBREL_PROXY_AUTH: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${APP_DATA_DIR}/data:/data
