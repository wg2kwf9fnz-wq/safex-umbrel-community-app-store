version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: safex-node-community-safex-core_status_1
      APP_PORT: 80

  init_data:
    image: busybox:1.36.1
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data && chown -R 999:999 /data"]
    volumes:
      - ${APP_DATA_DIR}/data:/data

  status:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./status/index.html:/usr/share/nginx/html/index.html:ro

  node:
    image: ghcr.io/wg2kwf9fnz-wq/safex-core@sha256:2cec79d09bec4e3627da026d95cddb2e09e0d05fe781a295ee99b41d83f4d998
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      init_data:
        condition: service_completed_successfully
    ports:
      - "17401:17401"
    volumes:
      - ${APP_DATA_DIR}/data:/home/safex/.safex
