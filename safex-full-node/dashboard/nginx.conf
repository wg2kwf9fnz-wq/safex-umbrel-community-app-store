server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/get_info {
        proxy_pass http://node:17402/get_info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
