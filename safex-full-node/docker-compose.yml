services:
  app_proxy:
    environment:
      APP_HOST: safex-full-node_dashboard_1
      APP_PORT: 80

  node:
    image: ghcr.io/wg2kwf9fnz-wq/safex-node:7.0.3@sha256:0a96cd769a33a3cac6dfc2de14669c7b5965b218800059f916a7e2fcda561fa8
    restart: unless-stopped
    entrypoint:
      - safexd
    hostname: node
    stop_grace_period: 5m
    command:
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=17401
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=17402
      - --confirm-external-bind
      - --non-interactive
    ports:
      - "17401:17401"
    volumes:
      - ${APP_DATA_DIR}/data:/root/.safex

  stratum:
    # Built by .github/workflows/docker-stratum.yml in wg2kwf9fnz-wq/safex-node.
    image: ghcr.io/wg2kwf9fnz-wq/safex-stratum:6.26.0-sfx6@sha256:ad2666457963ffac7afad010a9513be2b7e622732d0e20649963832b6f652cc2
    restart: unless-stopped
    hostname: stratum
    stop_grace_period: 30s
    depends_on:
      - node
    environment:
      DAEMON_HOST: node
      DAEMON_PORT: 17402
      STRATUM_PORT: 17404
      API_PORT: 8080
      API_TOKEN: ${APP_SEED}
      DEFAULT_DIFF: 50000
    ports:
      - "17404:17404"
    volumes:
      - ${APP_DATA_DIR}/stratum:/data

  dashboard:
    # Self-contained image: nginx config + web page are baked in (no bind-mounted files).
    # Built by .github/workflows/docker-dashboard.yml in wg2kwf9fnz-wq/safex-node.
    image: ghcr.io/wg2kwf9fnz-wq/safex-dashboard:1.5.0@sha256:6819a6b7e6a2a25f87f511cd924d99acda1e366bf4cd4d115614246884de1ba8
    restart: unless-stopped
    depends_on:
      - node
      - stratum
    environment:
      STRATUM_API_TOKEN: ${APP_SEED}
    volumes:
      # read-only: lets the dashboard show how much disk space the node data takes up
      - ${APP_DATA_DIR}/data:/node-data:ro
