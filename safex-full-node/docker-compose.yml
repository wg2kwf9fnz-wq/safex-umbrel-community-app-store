version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: safex-full-node_dashboard_1
      APP_PORT: 80

  node:
    image: ghcr.io/wg2kwf9fnz-wq/safex-node:7.0.3@sha256:0a96cd769a33a3cac6dfc2de14669c7b5965b218800059f916a7e2fcda561fa8
    restart: unless-stopped
    entrypoint:
      - safexd
    hostname: node
    stop_grace_period: 5m
    command:
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=17401
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=17402
      - --confirm-external-bind
      - --non-interactive
    ports:
      - "17401:17401"
    volumes:
      - ${APP_DATA_DIR}/data:/root/.safex

  dashboard:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
