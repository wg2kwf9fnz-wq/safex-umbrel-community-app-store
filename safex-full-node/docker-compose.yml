services:
  app_proxy:
    environment:
      APP_HOST: safex-full-node_dashboard_1
      APP_PORT: 80

  node:
    image: ghcr.io/wg2kwf9fnz-wq/safex-node:7.0.3@sha256:0a96cd769a33a3cac6dfc2de14669c7b5965b218800059f916a7e2fcda561fa8
    restart: unless-stopped
    entrypoint:
      - safexd
    hostname: node
    stop_grace_period: 5m
    command:
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=17401
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=17402
      - --confirm-external-bind
      - --non-interactive
    ports:
      - "17401:17401"
    volumes:
      - ${APP_DATA_DIR}/data:/root/.safex

  stratum:
    # Built by .github/workflows/docker-stratum.yml in wg2kwf9fnz-wq/safex-node.
    image: ghcr.io/wg2kwf9fnz-wq/safex-stratum:6.26.0-sfx4@sha256:dc90dec58401a70310e2b26ab9d26016f36de413060ff9ff59b1847c2eb9f5f1
    restart: unless-stopped
    hostname: stratum
    stop_grace_period: 30s
    depends_on:
      - node
    environment:
      DAEMON_HOST: node
      DAEMON_PORT: 17402
      STRATUM_PORT: 17404
      API_PORT: 8080
      API_TOKEN: ${APP_SEED}
      DEFAULT_DIFF: 50000
    ports:
      - "17404:17404"
    volumes:
      - ${APP_DATA_DIR}/stratum:/data

  dashboard:
    # Self-contained image: nginx config + web page are baked in (no bind-mounted files).
    # Built by .github/workflows/docker-dashboard.yml in wg2kwf9fnz-wq/safex-node.
    image: ghcr.io/wg2kwf9fnz-wq/safex-dashboard:1.2.0@sha256:84b6b73448f8a2d126078dcdc89fbcc83b8644f6a2b60969e5622dbb182fc8ae
    restart: unless-stopped
    depends_on:
      - node
      - stratum
    environment:
      STRATUM_API_TOKEN: ${APP_SEED}
