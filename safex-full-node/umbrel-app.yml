gallery: []

path: ""

defaultUsername: ""

defaultPassword: ""

submitter: wg2kwf9fnz-wq

submission: https://github.com/wg2kwf9fnz-wq/safex-umbrel-community-app-store

releaseNotes: >-
  Fixes the stratum server crashing on start in 7.0.3-umbrel8 (missing Python module in
  the image). Miners use their own Safex address as the username and are paid any block
  they find; the dashboard hides workers after 12 hours and charts blocks per address.
