defaultPassword: ""

submitter: wg2kwf9fnz-wq

submission: https://github.com/wg2kwf9fnz-wq/safex-umbrel-community-app-store

releaseNotes: >-
  New blue party hat app icon. Dashboard clean-up: target height no longer shows below
  the current height, wallet addresses and worker names are condensed (Safex.....34e2N),
  the page fits phones, and a "share of network hashrate" figure was added. Default share
  difficulty raised from 20,000 to 50,000 (roughly one share every 9 seconds from a 5 kH/s
  miner); set a different value per worker with the username, e.g. rig1+200000.
