manifestVersion: 1

id: safex-full-node

icon: https://raw.githubusercontent.com/wg2kwf9fnz-wq/safex-umbrel-community-app-store/main/safex-full-node/icon.png

category: finance

name: Safex Full Node

version: "7.0.3-umbrel11"

tagline: Run a Safex full node with a built-in solo mining stratum server

description: >-
  Run a Safex mainnet full node on your Umbrel. The node synchronizes
  the Safex blockchain and participates in the peer-to-peer network.
  Includes a dashboard showing node status and synchronization information,
  and a built-in solo mining stratum server (xmrig-proxy patched for Safex,
  algorithm RandomSFX / rx/sfx) on port 17404. Point XMRig or rented hashrate
  at your Umbrel with your own Safex address as the username, and any block you find pays
  its full reward to that address. This is an independent community project and is not
  affiliated with, endorsed by, sponsored by, or officially connected
  to Safex or its developers.

developer: Independent community project

website: https://safex.org

port: 17403

