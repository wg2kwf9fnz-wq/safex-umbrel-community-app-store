defaultPassword: ""

submitter: wg2kwf9fnz-wq

submission: https://github.com/wg2kwf9fnz-wq/safex-umbrel-community-app-store

releaseNotes: >-
  Fixes the dashboard not loading (it is now a self-contained image instead of
  files copied into the app data folder) and adds a payout wallet box so you can
  set the Safex address your solo mining stratum server (port 17404) pays to.
