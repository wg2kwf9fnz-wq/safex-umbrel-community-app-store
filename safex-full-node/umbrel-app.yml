defaultPassword: ""

submitter: wg2kwf9fnz-wq

submission: https://github.com/wg2kwf9fnz-wq/safex-umbrel-community-app-store

releaseNotes: >-
  Dashboard: new Network difficulty history graph with a 24 hour and a 7 day view (lowest, highest, average and change shown above it, hover or touch for the exact value at a block). The history is read from the blockchain itself, so it is complete after any restart.
